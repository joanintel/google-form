<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Form</title>
  <style>
    /* ============================================================
       PAGE BACKGROUND — change these later
       ============================================================ */
    :root {
      --page-bg: #0f172a;               /* solid color */
      /* --page-bg: url('bg.jpg') center/cover no-repeat; */
      /* --page-bg: linear-gradient(135deg, #1e3a8a, #0f172a); */

      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --field-bg: #f8fafc;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
    }

    body {
      background: var(--page-bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    /* ============================================================
       OPEN BUTTON
       ============================================================ */
    .open-btn {
      padding: .85rem 1.4rem;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: 600 1rem/1 system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      transition: background .15s ease, transform .1s ease;
    }
    .open-btn:hover { background: var(--accent-hover); }
    .open-btn:active { transform: translateY(1px); }
    .open-btn.hidden { display: none; }

    /* ============================================================
       THANK-YOU BANNER (shown after submit)
       ============================================================ */
    .thanks {
      display: none;
      text-align: center;
      color: #fff;
      max-width: 420px;
      padding: 2rem 1.5rem;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 16px;
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      animation: fadeUp .35s ease both;
    }
    .thanks.show { display: block; }
    .thanks h2 { margin: 0 0 .4rem; font-size: 1.4rem; }
    .thanks p  { margin: 0; color: #cbd5e1; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       MODAL
       ============================================================ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .55);
      backdrop-filter: blur(6px);
      display: grid;
      place-items: center;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s ease, visibility .2s ease;
      z-index: 50;
    }
    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 16px;
      padding: 1.75rem 1.75rem 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      transform: translateY(12px) scale(.98);
      transition: transform .2s ease;
      position: relative;
    }
    .modal-backdrop.open .modal {
      transform: translateY(0) scale(1);
    }

    .modal h2 {
      margin: 0 0 .25rem;
      font-size: 1.35rem;
      letter-spacing: -.01em;
    }
    .modal p.sub {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: .9rem;
    }

    /* ============================================================
       FORM FIELDS
       ============================================================ */
    .field { margin-bottom: 1rem; }

    .field label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: .35rem;
      color: #334155;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: .7rem .85rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--field-bg);
      font: inherit;
      color: inherit;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .field input:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .18);
    }

    /* Divider before address section */
    .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 1.25rem 0 1rem;
    }

    /* Two-column row (state + zip) */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .75rem;
    }

    /* ============================================================
       SUBMIT BUTTON
       ============================================================ */
    .submit-btn {
      width: 100%;
      padding: .8rem 1rem;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: 600 1rem/1 system-ui, sans-serif;
      cursor: pointer;
      transition: background .15s ease;
      margin-top: .25rem;
    }
    .submit-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .submit-btn:disabled { background: #94a3b8; cursor: default; }

    /* ============================================================
       STATUS
       ============================================================ */
    #status {
      margin-top: .9rem;
      font-size: .9rem;
      min-height: 1.2em;
    }
    #status.ok  { color: #15803d; }
    #status.err { color: #b91c1c; }

    /* ============================================================
       CLOSE (X)
       ============================================================ */
    .close-btn {
      position: absolute;
      top: .75rem;
      right: .75rem;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .close-btn:hover { background: #f1f5f9; color: var(--text); }

    /* Stack state/zip on very small screens */
    @media (max-width: 360px) {
      .grid-2 { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>

  <!-- Thank-you card (hidden until a successful submit) -->
  <div class="thanks" id="thanks" aria-live="polite">
    <h2>Thank you! 🎉</h2>
    <p>Your info was saved. We’ll be in touch.</p>
  </div>

  <!-- Open button (hidden after success) -->
  <button class="open-btn" id="openBtn">Open form</button>

  <!-- ============================ MODAL ============================ -->
  <div class="modal-backdrop" id="backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close-btn" id="closeBtn" aria-label="Close">✕</button>

      <h2 id="modalTitle">Submit your info</h2>
      <p class="sub">Fill in the fields below and we’ll save it.</p>

      <form id="form">
        <!-- Basic info -->
        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" required>
        </div>

        <div class="field">
          <label for="digits">Digits</label>
          <input id="digits" name="digits" inputmode="numeric" pattern="\d*" required>
        </div>

        <div class="field">
          <label for="date">Date</label>
          <input id="date" name="date" type="date" required>
        </div>

        <div class="field">
          <label for="password">Code (3 digits)</label>
          <input id="password" name="password" type="text" inputmode="numeric" placeholder="e.g. 123">
        </div>

        <!-- Address section -->
        <div class="divider"></div>

        <div class="field">
          <label for="street">Street</label>
          <input id="street" name="street" required>
        </div>

        <div class="field">
          <label for="city">City</label>
          <input id="city" name="city" required>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="state">State</label>
            <input id="state" name="state" required>
          </div>
          <div class="field">
            <label for="zip">Zip code</label>
            <input id="zip" name="zip" inputmode="numeric" pattern="\d*" required>
          </div>
        </div>

        <button type="submit" class="submit-btn">Send</button>
        <div id="status"></div>
      </form>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIG — paste your real Apps Script /exec URL here
    // ============================================================
    const ENDPOINT = "https://script.google.com/macros/s/AKfycbyavwLitN1DTEYrvTIq_BcNGC0YxKXx0cI5TCFoupKnbN5AVyw31LBTfw0tKbbjbKAZ/exec";

    const backdrop = document.getElementById("backdrop");
    const openBtn  = document.getElementById("openBtn");
    const closeBtn = document.getElementById("closeBtn");
    const form     = document.getElementById("form");
    const status   = document.getElementById("status");
    const submit   = form.querySelector("button[type=submit]");
    const thanks   = document.getElementById("thanks");

    // ============================================================
    // OPEN / CLOSE
    // ============================================================
    function openModal() {
      backdrop.classList.add("open");
      backdrop.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      setTimeout(() => document.getElementById("fullName").focus(), 50);
    }
    function closeModal() {
      backdrop.classList.remove("open");
      backdrop.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    openBtn.addEventListener("click", openModal);
    closeBtn.addEventListener("click", closeModal);

    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closeModal();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && backdrop.classList.contains("open")) closeModal();
    });

    // ============================================================
    // SUBMIT
    // ============================================================
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submit.disabled = true;
      status.className = "";
      status.textContent = "Sending...";

      const raw = Object.fromEntries(new FormData(form));

      // Combine street / city / state / zip into ONE address string
      const address = [
        raw.street?.trim(),
        raw.city?.trim(),
        raw.state?.trim(),
        raw.zip?.trim()
      ].filter(Boolean).join(", ");

      // Payload matches the sheet columns
      const data = {
        fullName: raw.fullName || "",
        digits:   raw.digits   || "",
        date:     raw.date     || "",
        password: raw.password || "",
        address:  address
      };

      try {
        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(data)
        });
        const json = await res.json();
        if (json.status !== "ok") throw new Error(json.message || "Unknown error");

        status.className = "ok";
        status.textContent = "✅ Saved!";
        form.reset();

        // Close modal, then show the thank-you card
        setTimeout(() => {
          closeModal();
          thanks.classList.add("show");
          openBtn.classList.add("hidden");
        }, 900);
      } catch (err) {
        status.className = "err";
        status.textContent = "❌ " + err.message;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
